server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 101m;

    location /api/ {
        proxy_pass http://api:8080/;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_intercept_errors off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
