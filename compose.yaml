services:
  mlflow:
    profiles: ["training"]
    image: ghcr.io/mlflow/mlflow:v3.16.1
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow-data/mlflow.db
      - --artifacts-destination=/mlflow-data/artifacts
      - --allowed-hosts=localhost:*,127.0.0.1:*,mlflow:5000
      - --workers=1
    volumes:
      - ./data/mlflow:/mlflow-data
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - api
    restart: unless-stopped
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    profiles: ["public"]
    depends_on:
      - frontend
    restart: unless-stopped
