name: music-genre-identifier-CD
run-name: CD

on:
    workflow_run:
        workflows: ["music-genre-identifier-CI"]
        types:
            - completed
        branches:
            - main

permissions:
    contents: read
    id-token: write

jobs:
    deploy:
        runs-on: ubuntu-24.04
        if: >-
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push'
        steps:
            - name: checkout tested commit
              id: checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
            - name: Authenticate to Google Cloud
              id: auth
              uses: google-github-actions/auth@v3
              with:
                token_format: access_token
                project_id: ${{ vars.GCP_PROJECT_ID }}
                workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
            - name: Login to Artifact Registry
              id: login
              uses: docker/login-action@v4
              with:
                  registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
                  username: oauth2accesstoken
                  password: ${{ steps.auth.outputs.access_token }}
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Build and push Docker image to Google Artifact Registry
              id: docker_build
              uses: docker/build-push-action@v7
              with:
                context: .
                push: true
                tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{vars.CLOUD_RUN_SERVICE}}:${{ steps.checkout.outputs.ref }}
            - name: Deploy to Cloud Run
              id: deploy
              uses: google-github-actions/deploy-cloudrun@v3
              with:
                service: ${{ vars.CLOUD_RUN_SERVICE }}
                image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.CLOUD_RUN_SERVICE }}:${{ steps.checkout.outputs.ref }}
                region: ${{ vars.GCP_REGION }}
                project_id: ${{ vars.GCP_PROJECT_ID }}
            - name: Health check Cloud Run service
              run: |
                curl --fail --show-error --silent --retry 5 --retry-delay 5 "${{ steps.deploy.outputs.url }}/health"


            